name: Python regression tests

on:
  push:
    branches: [fix/maic-judge-reliability-20261010]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q solar_agent.py heliopolis_ocr.py app_logic.py app.py tests
      - name: Run offline regression tests
        run: pytest -q tests
