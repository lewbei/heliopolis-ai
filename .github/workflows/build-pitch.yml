name: Build MAIC text-backup PDF

on:
  pull_request:
    paths:
      - "PITCH_DECK.md"
      - "generate_pitch_deck.py"
      - ".github/workflows/build-pitch.yml"
  push:
    branches: [master]
    paths:
      - "PITCH_DECK.md"
      - "generate_pitch_deck.py"
      - ".github/workflows/build-pitch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plotting dependencies
        run: pip install matplotlib
      - name: Build current PDF
        run: |
          python generate_pitch_deck.py
          python - <<'PY'
          from pathlib import Path
          from generate_pitch_deck import parse_slides
          sections = parse_slides(Path("PITCH_DECK.md").read_text(encoding="utf-8"))
          assert len(sections) == 9
          data = Path("pitch_deck.pdf").read_bytes()
          assert data.startswith(b"%PDF") and len(data) > 10000
          print("Verified PDF bytes:", len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: heliopolis-maic-pitch-pdf
          path: pitch_deck.pdf
          retention-days: 30
